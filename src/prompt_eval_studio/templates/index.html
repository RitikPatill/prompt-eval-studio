{% extends "base.html" %}
{% block title %}Run Evaluation — PromptEval Studio{% endblock %}
{% block content %}
<h2 style="color:#a0c4ff; margin-bottom:1.5rem; font-size:1.1rem;">New Evaluation Run</h2>

<form method="post" action="/run" style="max-width:560px;">

  <div class="form-group">
    <label for="suite_path">Suite file path</label>
    <input type="text" id="suite_path" name="suite_path"
           placeholder="examples/qa_suite.yaml" required>
  </div>

  <div class="form-group">
    <label>Models to evaluate</label>
    <div class="checkbox-group">
      {% for model in models %}
      <label>
        <input type="checkbox" name="models" value="{{ model }}"
               {% if loop.index <= 2 %}checked{% endif %}>
        {{ model }}
      </label>
      {% endfor %}
    </div>
  </div>

  <div class="form-group">
    <label for="threshold">Pass threshold (score ≥ N)</label>
    <input type="number" id="threshold" name="threshold"
           min="1" max="5" value="3" style="width:80px;">
  </div>

  <button type="submit">Run Evaluation</button>
</form>
{% endblock %}

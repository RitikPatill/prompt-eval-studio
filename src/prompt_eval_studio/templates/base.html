<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PromptEval Studio{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.3" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Courier New', Courier, monospace;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 2rem;
    }
    header {
      border-bottom: 1px solid #333;
      padding-bottom: 1rem;
      margin-bottom: 2rem;
    }
    header h1 { font-size: 1.4rem; color: #a0c4ff; }
    header p { font-size: 0.8rem; color: #666; margin-top: 0.25rem; }
    a { color: #a0c4ff; }

    /* Forms */
    label { display: block; margin-bottom: 0.25rem; color: #aaa; font-size: 0.85rem; }
    input[type="text"], input[type="number"] {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #e0e0e0;
      padding: 0.5rem 0.75rem;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.9rem;
      width: 100%;
    }
    input[type="text"]:focus, input[type="number"]:focus {
      outline: none;
      border-color: #a0c4ff;
    }
    .form-group { margin-bottom: 1.25rem; }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.5rem; }
    .checkbox-group label {
      display: flex; align-items: center; gap: 0.4rem;
      cursor: pointer; color: #e0e0e0; font-size: 0.9rem;
    }
    input[type="checkbox"] { accent-color: #a0c4ff; }
    button, .btn {
      background: #1e3a5f;
      color: #a0c4ff;
      border: 1px solid #a0c4ff;
      padding: 0.5rem 1.25rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      text-decoration: none;
      display: inline-block;
    }
    button:hover, .btn:hover { background: #264a7a; }

    /* Results table */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      font-size: 0.85rem;
    }
    th {
      background: #1a1a1a;
      color: #a0c4ff;
      text-align: left;
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid #333;
    }
    td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #1e1e1e;
      vertical-align: top;
    }
    tr:hover td { background: #111; }

    /* Score badges */
    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 3px;
      font-weight: bold;
      font-size: 0.8rem;
    }
    .score-high { background: #1a3d1a; color: #4caf50; border: 1px solid #2e6b2e; }
    .score-mid  { background: #3d3000; color: #ffc107; border: 1px solid #6b5000; }
    .score-low  { background: #3d1a1a; color: #f44336; border: 1px solid #6b2a2a; }
    .score-zero { background: #2a2a2a; color: #888;    border: 1px solid #444; }

    /* Latency badge */
    .latency { color: #888; font-size: 0.78rem; }

    /* Rationale */
    details summary { cursor: pointer; color: #888; font-size: 0.8rem; }
    details[open] summary { color: #a0c4ff; }
    details p { margin-top: 0.4rem; color: #ccc; font-size: 0.82rem; line-height: 1.5; }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 1.2rem; height: 1.2rem;
      border: 2px solid #333;
      border-top-color: #a0c4ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .running-msg { color: #888; margin-top: 1rem; }

    /* Error / info banners */
    .banner-error {
      background: #3d1a1a; color: #f44336;
      border: 1px solid #6b2a2a;
      padding: 0.75rem 1rem; border-radius: 4px; margin-top: 1rem;
    }
    .summary-bar {
      margin-top: 1rem; font-size: 0.85rem; color: #aaa;
    }
    .summary-bar span { margin-right: 1.5rem; }
    .pass { color: #4caf50; } .fail { color: #f44336; }
  </style>
</head>
<body>
  <header>
    <h1>PromptEval Studio</h1>
    <p>LLM prompt evaluation harness</p>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
